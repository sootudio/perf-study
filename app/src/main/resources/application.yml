server:
  port: 18080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/perfstudy
    username: perf
    password: perf
    hikari:
      maximum-pool-size: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
